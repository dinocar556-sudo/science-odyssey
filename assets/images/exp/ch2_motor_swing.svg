<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="40" y="54" font-size="31" font-weight="700" fill="#0f172a">전류 그네 장치 — 말굽자석 사이에 매단 구리 막대</text>
  <text x="40" y="90" font-size="21" fill="#475569">스위치를 닫으면 구리 막대에 전류가 흐른다 (앞에서 본 모습)</text>

  <!-- 받침대 -->
  <rect x="150" y="600" width="660" height="18" rx="4" fill="#94a3b8"/>
  <rect x="190" y="160" width="14" height="440" fill="#64748b"/>
  <rect x="756" y="160" width="14" height="440" fill="#64748b"/>
  <rect x="180" y="150" width="600" height="16" rx="4" fill="#64748b"/>

  <!-- 매단 도선 두 가닥 -->
  <line x1="330" y1="166" x2="330" y2="380" stroke="#b45309" stroke-width="4"/>
  <line x1="630" y1="166" x2="630" y2="380" stroke="#b45309" stroke-width="4"/>
  <!-- 구리 막대 -->
  <rect x="300" y="372" width="360" height="16" rx="8" fill="#d97706" stroke="#92400e" stroke-width="3"/>
  <text x="300" y="418" font-size="22" font-weight="700" fill="#92400e">구리 막대</text>

  <!-- 말굽자석: 막대 위(N)와 아래(S)에 극, 오른쪽으로 휘어 이어짐 (매단 도선과 겹치지 않게) -->
  <rect x="410" y="300" width="130" height="56" rx="6" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
  <text x="475" y="338" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">N</text>
  <rect x="410" y="420" width="130" height="56" rx="6" fill="#3b82f6" stroke="#1e3a8a" stroke-width="3"/>
  <text x="475" y="458" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">S</text>
  <path d="M 540 328 Q 598 328 598 388 Q 598 448 540 448" fill="none" stroke="#64748b" stroke-width="20" stroke-linecap="round" opacity="0.85"/>
  <text x="475" y="512" font-size="23" font-weight="700" fill="#334155" text-anchor="middle">말굽자석</text>

  <!-- 전지와 스위치 (열림) -->
  <rect x="930" y="250" width="150" height="84" rx="10" fill="#1e293b"/>
  <rect x="1080" y="276" width="14" height="32" rx="3" fill="#475569"/>
  <text x="1005" y="300" font-size="24" font-weight="700" fill="#fde047" text-anchor="middle">전지</text>
  <text x="944" y="276" font-size="20" font-weight="700" fill="#f87171">+</text>
  <text x="1060" y="326" font-size="22" font-weight="700" fill="#93c5fd">−</text>
  <!-- 도선: 받침대 위 도선 고정점 → 전지 -->
  <polyline points="330,158 330,125 900,125 900,290 930,290" fill="none" stroke="#475569" stroke-width="3"/>
  <polyline points="630,158 630,110 860,110 860,500 940,500" fill="none" stroke="#475569" stroke-width="3"/>
  <!-- 스위치 -->
  <circle cx="940" cy="500" r="7" fill="#334155"/>
  <line x1="940" y1="500" x2="1000" y2="465" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1010" cy="500" r="7" fill="#334155"/>
  <polyline points="1010,500 1110,500 1110,290 1094,290" fill="none" stroke="#475569" stroke-width="3"/>
  <text x="975" y="545" font-size="22" font-weight="700" fill="#334155" text-anchor="middle">스위치 (열림)</text>

  <rect x="40" y="625" width="1120" height="1" fill="#e2e8f0"/>
  <text x="600" y="660" font-size="22" fill="#0f172a" text-anchor="middle">스위치를 닫으면 구리 막대는 <tspan font-weight="700">어떻게 될까?</tspan></text>
</svg>
