<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <!-- 고정 막대 -->
    <g id="peg"><rect x="-14" y="-34" width="14" height="68" fill="#64748b"/>
      <g stroke="#94a3b8" stroke-width="2"><line x1="-14" y1="-26" x2="-26" y2="-14"/><line x1="-14" y1="-6" x2="-26" y2="6"/><line x1="-14" y1="14" x2="-26" y2="26"/></g></g>
  </defs>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="40" y="50" font-size="27" font-weight="700" fill="#0f172a">고무줄을 기준점 O까지 늘여 합력 재기</text>
  <text x="40" y="82" font-size="19" fill="#475569">한쪽 끝을 고정한 고무줄을 두 힘으로 늘인 효과 = 한 힘으로 같은 점 O까지 늘인 효과 → 그 한 힘이 합력</text>
  <line x1="600" y1="100" x2="600" y2="470" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="300" y="122" font-size="21" font-weight="700" fill="#334155" text-anchor="middle">두 힘으로 늘이기</text>
  <text x="900" y="122" font-size="21" font-weight="700" fill="#16a34a" text-anchor="middle">한 힘(합력)으로 같은 점까지</text>

  <!-- ① 같은 방향 -->
  <text x="40" y="168" font-size="21" font-weight="700" fill="#334155">① 같은 방향</text>
  <use href="#peg" x="70" y="225"/>
  <polyline points="70,225 100,213 130,237 160,213 190,237 220,213 250,237 280,213 310,237 340,213 356,225" fill="none" stroke="#a16207" stroke-width="4"/>
  <line x1="370" y1="180" x2="370" y2="275" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/><text x="378" y="280" font-size="19" fill="#475569">O</text>
  <circle cx="370" cy="225" r="13" fill="none" stroke="#334155" stroke-width="5"/>
  <line x1="383" y1="212" x2="463" y2="212" stroke="#2563eb" stroke-width="6" marker-end="url(#b)"/><text x="472" y="219" font-size="20" fill="#2563eb">2 N</text>
  <line x1="383" y1="238" x2="503" y2="238" stroke="#2563eb" stroke-width="6" marker-end="url(#b)"/><text x="512" y="245" font-size="20" fill="#2563eb">3 N</text>

  <use href="#peg" x="640" y="225"/>
  <polyline points="640,225 670,213 700,237 730,213 760,237 790,213 820,237 850,213 880,237 910,213 926,225" fill="none" stroke="#a16207" stroke-width="4"/>
  <line x1="940" y1="180" x2="940" y2="275" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/><text x="948" y="280" font-size="19" fill="#475569">O</text>
  <circle cx="940" cy="225" r="13" fill="none" stroke="#334155" stroke-width="5"/>
  <line x1="953" y1="225" x2="1133" y2="225" stroke="#16a34a" stroke-width="8" marker-end="url(#g)"/><text x="1040" y="205" font-size="22" font-weight="700" fill="#16a34a">5 N</text>

  <!-- ② 반대 방향 -->
  <text x="40" y="340" font-size="21" font-weight="700" fill="#334155">② 반대 방향</text>
  <use href="#peg" x="70" y="395"/>
  <polyline points="70,395 92,383 114,407 136,383 158,407 180,383 196,395" fill="none" stroke="#a16207" stroke-width="4"/>
  <line x1="210" y1="350" x2="210" y2="445" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/><text x="196" y="462" font-size="19" fill="#475569">O</text>
  <circle cx="210" cy="395" r="13" fill="none" stroke="#334155" stroke-width="5"/>
  <line x1="223" y1="395" x2="343" y2="395" stroke="#2563eb" stroke-width="6" marker-end="url(#b)"/><text x="352" y="402" font-size="20" fill="#2563eb">3 N</text>
  <path d="M 210 408 L 210 425 L 140 425" fill="none" stroke="#dc2626" stroke-width="6" marker-end="url(#r)"/><text x="95" y="432" font-size="20" fill="#dc2626">2 N</text>

  <use href="#peg" x="640" y="395"/>
  <polyline points="640,395 662,383 684,407 706,383 728,407 750,383 766,395" fill="none" stroke="#a16207" stroke-width="4"/>
  <line x1="780" y1="350" x2="780" y2="445" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/><text x="788" y="450" font-size="19" fill="#475569">O</text>
  <circle cx="780" cy="395" r="13" fill="none" stroke="#334155" stroke-width="5"/>
  <line x1="793" y1="395" x2="843" y2="395" stroke="#16a34a" stroke-width="8" marker-end="url(#g)"/><text x="860" y="403" font-size="22" font-weight="700" fill="#16a34a">1 N</text>

  <!-- 결과 정리 -->
  <rect x="40" y="495" width="1120" height="155" rx="14" fill="#e2e8f0"/>
  <text x="70" y="535" font-size="21" fill="#0f172a">① 같은 방향: 2 N + 3 N = <tspan font-weight="700" fill="#16a34a">5 N</tspan> (두 힘을 더한다)</text>
  <text x="70" y="570" font-size="21" fill="#0f172a">② 반대 방향: 3 N − 2 N = <tspan font-weight="700" fill="#16a34a">1 N</tspan>, 큰 힘의 방향 (두 힘을 뺀다)</text>
  <text x="70" y="605" font-size="21" fill="#0f172a">③ 고무줄 없이 고리 양쪽을 3 N씩 반대로 당기면: 3 N − 3 N = <tspan font-weight="700" fill="#16a34a">0</tspan> → 고리가 움직이지 않음 (힘의 평형)</text>
  <text x="70" y="636" font-size="18" fill="#475569">화살표 길이는 힘의 크기에 비례</text>
</svg>
