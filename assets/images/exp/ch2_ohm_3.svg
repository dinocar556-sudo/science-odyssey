<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">저항이 다른 두 니크롬선의 전압-전류 그래프</text>
  <g stroke="#e2e8f0" stroke-width="1.5">
    <line x1="140" y1="504" x2="1100" y2="504"/><line x1="140" y1="408" x2="1100" y2="408"/>
    <line x1="140" y1="312" x2="1100" y2="312"/><line x1="140" y1="216" x2="1100" y2="216"/><line x1="140" y1="120" x2="1100" y2="120"/>
    <line x1="336" y1="110" x2="336" y2="600"/><line x1="532" y1="110" x2="532" y2="600"/>
    <line x1="728" y1="110" x2="728" y2="600"/><line x1="924" y1="110" x2="924" y2="600"/>
  </g>
  <line x1="140" y1="600" x2="1110" y2="600" stroke="#0f172a" stroke-width="3"/>
  <line x1="140" y1="600" x2="140" y2="100" stroke="#0f172a" stroke-width="3"/>
  <g font-size="20" fill="#334155" text-anchor="middle">
    <text x="140" y="628">0</text><text x="336" y="628">1.5</text><text x="532" y="628">3.0</text><text x="728" y="628">4.5</text><text x="924" y="628">6.0</text>
  </g>
  <g font-size="20" fill="#334155" text-anchor="end">
    <text x="128" y="511">0.1</text><text x="128" y="415">0.2</text><text x="128" y="319">0.3</text><text x="128" y="223">0.4</text><text x="128" y="127">0.5</text>
  </g>
  <text x="620" y="662" font-size="22" fill="#0f172a" text-anchor="middle">전압 (V)</text>
  <text x="40" y="92" font-size="22" fill="#0f172a">전류 (A)</text>

  <line x1="140" y1="600" x2="1055" y2="152" stroke="#2563eb" stroke-width="4"/>
  <g fill="#2563eb" stroke="#fff" stroke-width="3">
    <circle cx="336" cy="504" r="10"/><circle cx="532" cy="408" r="10"/><circle cx="728" cy="312" r="10"/><circle cx="924" cy="216" r="10"/>
  </g>
  <line x1="140" y1="600" x2="1055" y2="376" stroke="#dc2626" stroke-width="4"/>
  <g fill="#dc2626" stroke="#fff" stroke-width="3">
    <circle cx="336" cy="552" r="10"/><circle cx="532" cy="504" r="10"/><circle cx="728" cy="456" r="10"/><circle cx="924" cy="408" r="10"/>
  </g>
  <line x1="924" y1="216" x2="924" y2="408" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="940" y="230" font-size="21" fill="#2563eb" font-weight="700">15 Ω: 6.0 V에서 0.4 A</text>
  <text x="940" y="420" font-size="21" fill="#dc2626" font-weight="700">30 Ω: 6.0 V에서 0.2 A</text>
  <text x="940" y="320" font-size="20" fill="#475569">→ 저항이 2배면</text>
  <text x="940" y="346" font-size="20" fill="#475569">   전류는 절반</text>

  <rect x="170" y="120" width="250" height="90" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <line x1="190" y1="148" x2="240" y2="148" stroke="#2563eb" stroke-width="5"/><text x="255" y="156" font-size="21" fill="#0f172a">저항 15 Ω</text>
  <line x1="190" y1="186" x2="240" y2="186" stroke="#dc2626" stroke-width="5"/><text x="255" y="194" font-size="21" fill="#0f172a">저항 30 Ω</text>
</svg>
