<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <!-- 용수철저울 (가로) -->
    <g id="scale">
      <rect x="0" y="-15" width="100" height="30" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
      <polyline points="10,0 18,-9 26,9 34,-9 42,9 50,-9 58,9 66,-9 74,9 82,-9 90,0" fill="none" stroke="#475569" stroke-width="2.5"/>
    </g>
    <!-- 수레 -->
    <g id="cart">
      <rect x="-62" y="-36" width="124" height="46" rx="8" fill="#fde68a" stroke="#a16207" stroke-width="4"/>
      <circle cx="-35" cy="18" r="14" fill="#334155"/><circle cx="35" cy="18" r="14" fill="#334155"/>
      <circle cx="-35" cy="18" r="5" fill="#cbd5e1"/><circle cx="35" cy="18" r="5" fill="#cbd5e1"/>
    </g>
  </defs>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="40" y="54" font-size="31" font-weight="700" fill="#0f172a">고무줄을 빼고 당겨 보기 — 물체는 언제 움직일까?</text>
  <text x="40" y="90" font-size="21" fill="#475569">화살표 길이는 힘의 크기를 나타낸다</text>
  <line x1="560" y1="115" x2="560" y2="650" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- 왼쪽: 고리를 양쪽에서 3 N씩 -->
  <text x="40" y="150" font-size="25" font-weight="700" fill="#334155">① 고리 양쪽을 3 N씩 반대로 당기기</text>
  <text x="185" y="272" font-size="27" font-weight="700" fill="#dc2626" text-anchor="middle">3 N</text>
  <line x1="246" y1="300" x2="126" y2="300" stroke="#dc2626" stroke-width="8" marker-end="url(#r)"/>
  <text x="355" y="272" font-size="27" font-weight="700" fill="#2563eb" text-anchor="middle">3 N</text>
  <line x1="294" y1="300" x2="414" y2="300" stroke="#2563eb" stroke-width="8" marker-end="url(#b)"/>
  <use href="#scale" x="50" y="370"/>
  <line x1="150" y1="370" x2="248" y2="370" stroke="#475569" stroke-width="3"/>
  <circle cx="270" cy="370" r="21" fill="none" stroke="#334155" stroke-width="7"/>
  <line x1="292" y1="370" x2="390" y2="370" stroke="#475569" stroke-width="3"/>
  <use href="#scale" x="390" y="370"/>
  <rect x="50" y="440" width="440" height="84" rx="12" fill="#e2e8f0"/>
  <text x="270" y="491" font-size="26" fill="#0f172a" text-anchor="middle">고리가 <tspan font-weight="700">제자리에 그대로</tspan> 있다</text>

  <!-- 오른쪽 위: 수레를 같은 힘으로 -->
  <text x="590" y="150" font-size="25" font-weight="700" fill="#334155">② 수레를 양쪽에서 같은 힘으로</text>
  <text x="755" y="232" font-size="23" fill="#dc2626" text-anchor="middle">같은 크기</text>
  <line x1="818" y1="252" x2="692" y2="252" stroke="#dc2626" stroke-width="8" marker-end="url(#r)"/>
  <text x="1005" y="232" font-size="23" fill="#2563eb" text-anchor="middle">같은 크기</text>
  <line x1="942" y1="252" x2="1068" y2="252" stroke="#2563eb" stroke-width="8" marker-end="url(#b)"/>
  <use href="#cart" x="880" y="272"/>
  <line x1="590" y1="304" x2="1170" y2="304" stroke="#94a3b8" stroke-width="3"/>
  <text x="880" y="352" font-size="25" fill="#0f172a" text-anchor="middle">수레가 <tspan font-weight="700">멈춰 있다</tspan></text>

  <!-- 오른쪽 아래: 한쪽을 더 세게 -->
  <text x="590" y="425" font-size="25" font-weight="700" fill="#334155">③ 오른쪽을 더 세게 당기면</text>
  <text x="790" y="502" font-size="23" fill="#dc2626" text-anchor="middle">약한 힘</text>
  <line x1="818" y1="522" x2="762" y2="522" stroke="#dc2626" stroke-width="8" marker-end="url(#r)"/>
  <text x="1040" y="502" font-size="23" fill="#2563eb" text-anchor="middle">센 힘</text>
  <line x1="942" y1="522" x2="1140" y2="522" stroke="#2563eb" stroke-width="8" marker-end="url(#b)"/>
  <use href="#cart" x="880" y="542"/>
  <line x1="590" y1="574" x2="1170" y2="574" stroke="#94a3b8" stroke-width="3"/>
  <line x1="790" y1="604" x2="1000" y2="604" stroke="#64748b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#m)"/>
  <text x="880" y="648" font-size="24" fill="#0f172a" text-anchor="middle">센 쪽으로 <tspan font-weight="700">움직이기 시작하고, 점점 빨라진다</tspan></text>
</svg>
