<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">높이에 따른 위치 에너지와 운동 에너지 (질량 1 kg, 공기 저항 무시)</text>

  <line x1="120" y1="560" x2="1080" y2="560" stroke="#0f172a" stroke-width="3"/>
  <line x1="180" y1="150" x2="1040" y2="150" stroke="#16a34a" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="1050" y="140" font-size="22" font-weight="700" fill="#16a34a" text-anchor="end">합 = 약 49 J (항상 같다)</text>

  <!-- 맨 위 -->
  <rect x="230" y="150" width="160" height="410" fill="#3b82f6"/>
  <text x="310" y="350" font-size="22" fill="#fff" text-anchor="middle" font-weight="700">위치</text>
  <text x="310" y="380" font-size="22" fill="#fff" text-anchor="middle">49 J</text>
  <!-- 중간 -->
  <rect x="520" y="355" width="160" height="205" fill="#3b82f6"/>
  <rect x="520" y="150" width="160" height="205" fill="#f97316"/>
  <text x="600" y="460" font-size="22" fill="#fff" text-anchor="middle" font-weight="700">위치</text>
  <text x="600" y="490" font-size="22" fill="#fff" text-anchor="middle">24.5 J</text>
  <text x="600" y="250" font-size="22" fill="#fff" text-anchor="middle" font-weight="700">운동</text>
  <text x="600" y="280" font-size="22" fill="#fff" text-anchor="middle">24.5 J</text>
  <!-- 바닥 직전 -->
  <rect x="810" y="150" width="160" height="410" fill="#f97316"/>
  <text x="890" y="350" font-size="22" fill="#fff" text-anchor="middle" font-weight="700">운동</text>
  <text x="890" y="380" font-size="22" fill="#fff" text-anchor="middle">49 J</text>

  <g font-size="22" fill="#0f172a" text-anchor="middle">
    <text x="310" y="595">높이 5 m</text><text x="310" y="623" font-size="19" fill="#64748b">(놓는 순간)</text>
    <text x="600" y="595">높이 2.5 m</text><text x="600" y="623" font-size="19" fill="#64748b">(중간)</text>
    <text x="890" y="595">높이 0 m</text><text x="890" y="623" font-size="19" fill="#64748b">(바닥 직전)</text>
  </g>
  <rect x="40" y="90" width="150" height="40" fill="none"/>
  <rect x="60" y="80" width="26" height="22" fill="#3b82f6"/><text x="96" y="99" font-size="20" fill="#0f172a">위치 에너지</text>
  <rect x="240" y="80" width="26" height="22" fill="#f97316"/><text x="276" y="99" font-size="20" fill="#0f172a">운동 에너지</text>
</svg>
