<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <g id="hit"><path d="M0,-12 L3,-3 L12,0 L3,3 L0,12 L-3,3 L-12,0 L-3,-3 Z" fill="#f59e0b"/></g>
  </defs>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">부피가 줄면 압력이 커지는 까닭 (입자 모형)</text>

  <!-- 왼쪽: 부피가 클 때 -->
  <rect x="120" y="170" width="400" height="400" fill="#e0f2fe" stroke="#0f172a" stroke-width="5"/>
  <g fill="#2563eb">
    <circle cx="170" cy="220" r="16"/><circle cx="300" cy="250" r="16"/><circle cx="440" cy="210" r="16"/>
    <circle cx="220" cy="330" r="16"/><circle cx="360" cy="320" r="16"/><circle cx="480" cy="370" r="16"/>
    <circle cx="160" cy="450" r="16"/><circle cx="280" cy="430" r="16"/><circle cx="420" cy="470" r="16"/>
    <circle cx="200" cy="540" r="16"/><circle cx="340" cy="530" r="16"/><circle cx="480" cy="520" r="16"/>
  </g>
  <g stroke="#475569" stroke-width="3" marker-end="url(#v)">
    <line x1="300" y1="250" x2="340" y2="225"/><line x1="220" y1="330" x2="190" y2="365"/>
    <line x1="420" y1="470" x2="460" y2="490"/><line x1="360" y1="320" x2="390" y2="290"/>
  </g>
  <use href="#hit" x="128" y="450"/><use href="#hit" x="440" y="178"/><use href="#hit" x="512" y="370"/>
  <text x="320" y="610" font-size="23" font-weight="700" fill="#0f172a" text-anchor="middle">부피가 클 때</text>
  <text x="320" y="642" font-size="20" fill="#475569" text-anchor="middle">벽에 덜 자주 부딪힘 → 압력이 작다</text>

  <text x="610" y="390" font-size="44" fill="#64748b" text-anchor="middle">→</text>

  <!-- 오른쪽: 부피가 절반일 때 -->
  <rect x="700" y="370" width="400" height="200" fill="#e0f2fe" stroke="#0f172a" stroke-width="5"/>
  <rect x="694" y="346" width="412" height="20" fill="#94a3b8" stroke="#0f172a" stroke-width="3"/>
  <line x1="900" y1="250" x2="900" y2="334" stroke="#dc2626" stroke-width="6" marker-end="url(#p)"/>
  <text x="920" y="290" font-size="21" fill="#dc2626">눌러서 부피를 절반으로</text>
  <g fill="#2563eb">
    <circle cx="740" cy="400" r="16"/><circle cx="820" cy="430" r="16"/><circle cx="900" cy="398" r="16"/>
    <circle cx="980" cy="428" r="16"/><circle cx="1062" cy="402" r="16"/><circle cx="760" cy="485" r="16"/>
    <circle cx="850" cy="500" r="16"/><circle cx="930" cy="470" r="16"/><circle cx="1010" cy="500" r="16"/>
    <circle cx="1070" cy="478" r="16"/><circle cx="800" cy="545" r="16"/><circle cx="950" cy="545" r="16"/>
  </g>
  <use href="#hit" x="708" y="400"/><use href="#hit" x="708" y="520"/><use href="#hit" x="1092" y="440"/>
  <use href="#hit" x="1092" y="530"/><use href="#hit" x="880" y="562"/><use href="#hit" x="1000" y="378"/>
  <text x="900" y="610" font-size="23" font-weight="700" fill="#0f172a" text-anchor="middle">부피가 절반일 때</text>
  <text x="900" y="642" font-size="20" fill="#475569" text-anchor="middle">벽에 더 자주 부딪힘 → 압력이 커진다</text>

  <rect x="40" y="80" width="1120" height="60" rx="12" fill="#fef3c7"/>
  <use href="#hit" x="80" y="110"/>
  <text x="105" y="118" font-size="21" fill="#0f172a">= 입자가 벽에 부딪힘.   두 상자 모두 입자 12개, 입자의 크기도 같다 (입자가 커지거나 줄어들지 않음)</text>
</svg>
