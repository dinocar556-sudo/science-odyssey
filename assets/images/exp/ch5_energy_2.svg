<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">태양 전지 장치의 에너지 전환</text>

  <!-- 전등 -->
  <circle cx="140" cy="330" r="62" fill="#fde047" stroke="#ca8a04" stroke-width="4"/>
  <g stroke="#f59e0b" stroke-width="5" stroke-linecap="round">
    <line x1="140" y1="240" x2="140" y2="212"/><line x1="140" y1="420" x2="140" y2="448"/>
    <line x1="50" y1="330" x2="22" y2="330"/><line x1="76" y1="266" x2="56" y2="246"/><line x1="76" y1="394" x2="56" y2="414"/>
  </g>
  <text x="140" y="500" font-size="24" font-weight="700" fill="#a16207" text-anchor="middle">빛에너지</text>

  <!-- 태양 전지 -->
  <g transform="translate(330,265)">
    <rect width="150" height="130" rx="8" fill="#1e3a8a" stroke="#0f172a" stroke-width="3"/>
    <g stroke="#60a5fa" stroke-width="2"><line x1="50" y1="0" x2="50" y2="130"/><line x1="100" y1="0" x2="100" y2="130"/><line x1="0" y1="43" x2="150" y2="43"/><line x1="0" y1="87" x2="150" y2="87"/></g>
  </g>
  <text x="405" y="430" font-size="22" fill="#0f172a" text-anchor="middle">태양 전지</text>

  <!-- 전기 -->
  <path d="M 640 245 L 600 335 L 640 335 L 610 420 L 690 310 L 650 310 L 680 245 Z" fill="#facc15" stroke="#a16207" stroke-width="3"/>
  <text x="645" y="500" font-size="24" font-weight="700" fill="#a16207" text-anchor="middle">전기 에너지</text>

  <!-- 모터 -->
  <rect x="820" y="285" width="120" height="90" rx="14" fill="#94a3b8" stroke="#334155" stroke-width="3"/>
  <line x1="940" y1="330" x2="990" y2="330" stroke="#334155" stroke-width="6"/>
  <g fill="#64748b"><ellipse cx="1000" cy="285" rx="16" ry="50"/><ellipse cx="1000" cy="375" rx="16" ry="50"/></g>
  <path d="M 1050 280 A 60 60 0 0 1 1050 380" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#f)"/>
  <text x="900" y="430" font-size="22" fill="#0f172a" text-anchor="middle">모터</text>
  <text x="960" y="500" font-size="24" font-weight="700" fill="#166534" text-anchor="middle">운동 에너지</text>

  <!-- 흐름 화살표 -->
  <g stroke="#334155" stroke-width="7" marker-end="url(#f)">
    <line x1="215" y1="330" x2="315" y2="330"/><line x1="495" y1="330" x2="585" y2="330"/><line x1="705" y1="330" x2="805" y2="330"/>
  </g>

  <!-- 열 손실 -->
  <g stroke="#dc2626" stroke-width="4" fill="none" marker-end="url(#h)">
    <path d="M 390 255 q -14 -20 0 -40 q 14 -20 0 -40 q -14 -20 0 -40"/>
    <path d="M 430 255 q -14 -20 0 -40 q 14 -20 0 -40 q -14 -20 0 -40"/>
    <path d="M 860 275 q -14 -20 0 -40 q 14 -20 0 -40 q -14 -20 0 -40"/>
    <path d="M 900 275 q -14 -20 0 -40 q 14 -20 0 -40 q -14 -20 0 -40"/>
  </g>
  <text x="470" y="130" font-size="21" font-weight="700" fill="#dc2626">열에너지로 빠져나감</text>
  <text x="940" y="150" font-size="21" font-weight="700" fill="#dc2626">열에너지로 빠져나감</text>

  <rect x="40" y="545" width="1120" height="105" rx="16" fill="#e2e8f0"/>
  <text x="600" y="585" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">들어간 빛에너지 = 운동 에너지 + 열에너지 등 (에너지의 총량은 보존된다)</text>
  <text x="600" y="625" font-size="21" fill="#334155" text-anchor="middle">일부가 열로 빠져나가므로 원하는 에너지로 100% 바뀌지 않는다 → 효율을 높이는 것이 중요</text>
</svg>
