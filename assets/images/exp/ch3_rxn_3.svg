<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <g id="H"><circle r="24" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/><circle cx="-7" cy="-8" r="6" fill="#ffffff" opacity="0.9"/></g>
    <g id="O"><circle r="34" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/><circle cx="-10" cy="-12" r="8" fill="#fca5a5"/></g>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">분자 모형으로 본 물의 생성</text>
  <text x="600" y="120" font-size="44" font-weight="700" fill="#0f172a" text-anchor="middle">2H₂  +  O₂  →  2H₂O</text>

  <!-- 수소 분자 2개 -->
  <use href="#H" x="170" y="230"/><use href="#H" x="210" y="230"/>
  <use href="#H" x="170" y="330"/><use href="#H" x="210" y="330"/>
  <text x="190" y="410" font-size="22" fill="#334155" text-anchor="middle">수소 분자 2개</text>
  <text x="315" y="295" font-size="48" fill="#64748b" text-anchor="middle">+</text>
  <!-- 산소 분자 1개 -->
  <use href="#O" x="410" y="280"/><use href="#O" x="462" y="280"/>
  <text x="436" y="410" font-size="22" fill="#334155" text-anchor="middle">산소 분자 1개</text>

  <line x1="560" y1="280" x2="680" y2="280" stroke="#0f172a" stroke-width="6" marker-end="url(#a)"/>

  <!-- 물 분자 2개 -->
  <use href="#O" x="790" y="262"/><use href="#H" x="752" y="292"/><use href="#H" x="828" y="292"/>
  <use href="#O" x="980" y="262"/><use href="#H" x="942" y="292"/><use href="#H" x="1018" y="292"/>
  <text x="885" y="410" font-size="22" fill="#334155" text-anchor="middle">물 분자 2개</text>

  <!-- 원자 수 비교 -->
  <g font-size="22" text-anchor="middle">
    <rect x="160" y="450" width="880" height="54" fill="#1e3a8a"/>
    <text x="330" y="485" fill="#fff" font-weight="700">원자</text>
    <text x="600" y="485" fill="#fff" font-weight="700">반응 전</text>
    <text x="870" y="485" fill="#fff" font-weight="700">반응 후</text>
    <rect x="160" y="504" width="880" height="54" fill="#fff" stroke="#cbd5e1"/>
    <text x="330" y="539" fill="#0f172a">수소 (흰 공)</text><text x="600" y="539" fill="#0f172a">4개</text><text x="870" y="539" fill="#0f172a">4개</text>
    <rect x="160" y="558" width="880" height="54" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="330" y="593" fill="#0f172a">산소 (빨간 공)</text><text x="600" y="593" fill="#0f172a">2개</text><text x="870" y="593" fill="#0f172a">2개</text>
  </g>
  <text x="600" y="648" font-size="21" fill="#475569" text-anchor="middle">원자의 종류와 수는 그대로, 배열만 바뀐다 · 계수비 2 : 1 : 2 = 분자 수의 비</text>
</svg>
