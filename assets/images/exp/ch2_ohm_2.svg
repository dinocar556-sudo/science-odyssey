<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">전압에 따른 전류 (니크롬선 15 Ω)</text>

  <!-- 측정표 -->
  <g font-size="24" text-anchor="middle">
    <rect x="50" y="120" width="360" height="56" fill="#1e3a8a"/>
    <text x="140" y="157" fill="#fff" font-weight="700">전압 (V)</text>
    <text x="320" y="157" fill="#fff" font-weight="700">전류 (A)</text>
    <g fill="#0f172a">
      <rect x="50" y="176" width="360" height="56" fill="#fff" stroke="#cbd5e1"/><text x="140" y="213">1.5</text><text x="320" y="213">0.1</text>
      <rect x="50" y="232" width="360" height="56" fill="#f1f5f9" stroke="#cbd5e1"/><text x="140" y="269">3.0</text><text x="320" y="269">0.2</text>
      <rect x="50" y="288" width="360" height="56" fill="#fff" stroke="#cbd5e1"/><text x="140" y="325">4.5</text><text x="320" y="325">0.3</text>
      <rect x="50" y="344" width="360" height="56" fill="#f1f5f9" stroke="#cbd5e1"/><text x="140" y="381">6.0</text><text x="320" y="381">0.4</text>
    </g>
    <line x1="230" y1="120" x2="230" y2="400" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="230" y="450" font-size="21" fill="#475569" text-anchor="middle">전압이 2배, 3배, 4배가 되면</text>
  <text x="230" y="480" font-size="21" fill="#475569" text-anchor="middle">전류도 2배, 3배, 4배가 된다</text>

  <!-- 그래프 -->
  <g stroke="#e2e8f0" stroke-width="1.5">
    <line x1="560" y1="492" x2="1120" y2="492"/><line x1="560" y1="404" x2="1120" y2="404"/>
    <line x1="560" y1="316" x2="1120" y2="316"/><line x1="560" y1="228" x2="1120" y2="228"/><line x1="560" y1="140" x2="1120" y2="140"/>
    <line x1="672" y1="140" x2="672" y2="580"/><line x1="784" y1="140" x2="784" y2="580"/>
    <line x1="896" y1="140" x2="896" y2="580"/><line x1="1008" y1="140" x2="1008" y2="580"/>
  </g>
  <line x1="560" y1="580" x2="1130" y2="580" stroke="#0f172a" stroke-width="3"/>
  <line x1="560" y1="580" x2="560" y2="125" stroke="#0f172a" stroke-width="3"/>
  <g font-size="20" fill="#334155" text-anchor="middle">
    <text x="560" y="608">0</text><text x="672" y="608">1.5</text><text x="784" y="608">3.0</text><text x="896" y="608">4.5</text><text x="1008" y="608">6.0</text>
  </g>
  <g font-size="20" fill="#334155" text-anchor="end">
    <text x="548" y="499">0.1</text><text x="548" y="411">0.2</text><text x="548" y="323">0.3</text><text x="548" y="235">0.4</text><text x="548" y="147">0.5</text>
  </g>
  <text x="845" y="645" font-size="22" fill="#0f172a" text-anchor="middle">전압 (V)</text>
  <text x="505" y="110" font-size="22" fill="#0f172a">전류 (A)</text>
  <line x1="560" y1="580" x2="1082" y2="169" stroke="#2563eb" stroke-width="4"/>
  <g fill="#2563eb" stroke="#fff" stroke-width="3">
    <circle cx="672" cy="492" r="10"/><circle cx="784" cy="404" r="10"/><circle cx="896" cy="316" r="10"/><circle cx="1008" cy="228" r="10"/>
  </g>
  <text x="700" y="200" font-size="22" fill="#2563eb" font-weight="700">원점을 지나는 직선</text>
</svg>
